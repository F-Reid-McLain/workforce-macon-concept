<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Workforce Navigator · Workforce Macon</title>
    <!-- The Directory is now part of the Workforce Navigator; keep old links working
         (directory.html?asset=mercer and directory.html#mercer both open that organization) -->
    <link rel="canonical" href="https://maconworkforce.com/navigator.html">
    <meta http-equiv="refresh" content="0; url=navigator.html">
    <script>
        (function () {
            var p = new URLSearchParams(location.search), id = p.get('asset') || location.hash.slice(1);
            location.replace('navigator.html' + (id ? '?asset=' + encodeURIComponent(id) : ''));
        })();
    </script>
</head>
<body>
    <p>The Directory is now part of the <a href="navigator.html">Workforce Navigator</a>.</p>
</body>
</html>
